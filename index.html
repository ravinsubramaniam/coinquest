<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Coin Quest</title>
<meta name="theme-color" content="#6d28d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coin Quest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ff; --card:#ffffff; --ink:#1e1b4b; --muted:#6b7280; --line:#e9e5ff;
  --brand:#6d28d9; --brand2:#8b5cf6; --gold:#f59e0b; --good:#059669; --bad:#dc2626; --save:#db2777; --spend:#2563eb;
  --chip:#ede9fe; --fd:Fredoka,Nunito,ui-rounded,system-ui,-apple-system,sans-serif; --shadow:0 6px 20px rgba(76,29,149,.10); --me:#6d28d9;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#120f24; --card:#1d1838; --ink:#f1efff; --muted:#a5a3c4; --line:#2e2856; --chip:#2b2452; --shadow:0 6px 20px rgba(0,0,0,.35);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px}
body{min-height:100vh;overscroll-behavior-y:contain}
h1,h2,h3,.fred{font-family:var(--fd);margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand2)}
label{display:block;font-weight:800;font-size:.86rem;margin:14px 0 6px;color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:14px;font-weight:800;background:var(--brand);color:#fff;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--chip);color:var(--brand)}
@media (prefers-color-scheme: dark){.btn.ghost{color:#c4b5fd}}
.btn.good{background:var(--good)} .btn.bad{background:var(--bad)} .btn.gold{background:var(--gold);color:#3b2300}
.btn.sm{padding:8px 12px;border-radius:11px;font-size:.88rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:800}
.chip.warn{background:#fee2e2;color:#991b1b}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none;background:var(--c,#8b5cf6)}
.av.lg{width:84px;height:84px;font-size:46px}
.av.sm{width:30px;height:30px;font-size:16px}
.hero{background:linear-gradient(135deg,var(--me),#8b5cf6 60%,#ec4899);color:#fff;border-radius:24px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero .big{font-family:var(--fd);font-size:2.6rem;font-weight:700;line-height:1}
.jars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.jar{background:rgba(255,255,255,.18);border-radius:16px;padding:10px 12px}
.jar b{font-family:var(--fd);font-size:1.35rem;display:block}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#fbbf24);border-radius:99px}
.hero .bar{background:rgba(255,255,255,.25)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -4px 20px rgba(0,0,0,.08);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:center;z-index:20}
.nav .in{display:flex;max-width:560px;width:100%}
.nav button{flex:1;padding:6px 0;border-radius:14px;font-size:.74rem;font-weight:800;color:var(--muted);position:relative}
.nav button span{display:block;font-size:1.45rem;line-height:1.3}
.nav button.on{color:var(--brand);background:var(--chip)}
@media (prefers-color-scheme: dark){.nav button.on{color:#c4b5fd}}
.badge{position:absolute;top:2px;right:22%;background:var(--bad);color:#fff;border-radius:99px;font-size:.7rem;padding:1px 6px}
.sec{margin:22px 4px 6px;font-family:var(--fd);font-size:1.1rem;font-weight:600}
.task{display:flex;gap:12px;align-items:center}
.task .ic{width:48px;height:48px;border-radius:14px;background:var(--chip);display:grid;place-items:center;font-size:26px;flex:none}
.task h3{font-size:1.05rem;font-weight:600}
.rew{font-family:var(--fd);font-weight:700;color:var(--good);white-space:nowrap}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty div{font-size:2.6rem}
.sheet-bg{position:fixed;inset:0;background:rgba(15,10,40,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 22px);animation:up .2s ease-out}
.sheet h2{font-size:1.35rem;margin-bottom:4px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.opt{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;cursor:pointer;font-weight:700}
.opt input{width:auto;margin:0}
.opt.on{border-color:var(--brand2);background:var(--chip)}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:800;font-size:.86rem;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.trow{display:grid;grid-template-columns:1.6fr .8fr .8fr 1fr 34px;gap:6px;margin:6px 0;align-items:center}
.trow input{padding:9px 8px}
.noscore .trow{grid-template-columns:2fr 1fr 34px}
.noscore .sc{display:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badgecard{text-align:center;padding:14px 6px;border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.badgecard .e{font-size:2.2rem}
.badgecard.off{opacity:.35;filter:grayscale(1)}
.badgecard b{display:block;font-size:.85rem;margin-top:4px}
.pin-dots{display:flex;gap:16px;justify-content:center;margin:22px 0}
.pin-dots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--brand2)}
.pin-dots i.f{background:var(--brand2)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:300px;margin:0 auto}
.pad button{height:68px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);font-family:var(--fd);font-size:1.7rem;font-weight:600}
.pad button:active{background:var(--chip)}
.who{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}
.who button{background:var(--card);border-radius:22px;padding:20px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:10px;font-family:var(--fd);font-size:1.2rem;font-weight:600}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:800;z-index:90;max-width:90vw;box-shadow:var(--shadow);animation:fade .2s}
.toast.err{background:var(--bad);color:#fff}
.busy{position:fixed;top:0;left:0;right:0;height:4px;z-index:95;overflow:hidden}
.busy i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--gold),var(--brand2));animation:slide 1s infinite ease-in-out}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.amt{font-family:var(--fd);font-weight:700;white-space:nowrap}
.amt.p{color:var(--good)} .amt.n{color:var(--bad)}
.celebrate{position:fixed;inset:0;z-index:80;background:rgba(15,10,40,.7);display:grid;place-items:center;padding:20px;animation:fade .2s}
.celebrate .box{background:var(--card);border-radius:28px;padding:26px 22px;text-align:center;max-width:380px;width:100%;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.conf{position:fixed;top:-40px;font-size:24px;z-index:81;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:1.15rem}
.hint{background:var(--chip);border-radius:14px;padding:12px;font-size:.88rem;margin:10px 0}
.flame{font-family:var(--fd);font-weight:700}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:42px;height:42px;border-radius:12px;font-size:22px;background:var(--bg);border:2px solid var(--line)}
.emojis button.on{border-color:var(--brand2);background:var(--chip)}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--ink)}
.meter{margin-top:10px}
.right{text-align:right}
a{color:var(--brand2)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="overlay"></div>
<script>
/* ============ CONFIG ============ */
// Paste your Apps Script Web App URL between the quotes (ends with /exec).
const API_URL = 'https://script.google.com/macros/s/AKfycbxXIujcW6L93_J5xVHw7BbHCQCfEAVnZKkAiNcCwSaq-gLq_I_hSKXs5lihLyGmGjKekQ/exec';
/* ================================ */

const CAT = { Chores:'🧹', School:'📚', Quiz:'🧠', Competition:'🏆', Reading:'📖', Sports:'⚽', Music:'🎵', Other:'⭐' };
const AVATARS = ['🚀','⚽','🦖','🦄','🐱','🐶','🦊','🐼','🐯','🦁','🌸','🎮','🏀','🎨','🌟','🐉','🐬','🦋','🤖','👑'];
const COLORS = ['#7c3aed','#2563eb','#059669','#db2777','#ea580c','#0891b2','#ca8a04','#4f46e5'];
const WISH_EMOJI = ['🎁','🧱','🎮','🧸','📚','⚽','🎨','🚲','🍦','🎧','📱','🦖'];

const LS = {
  get(k, d) { try { const v = localStorage.getItem('cq_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('cq_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('cq_' + k); } catch (e) {} }
};

const S = {
  api: API_URL || LS.get('api', ''),
  token: LS.get('token', null),
  members: LS.get('members', []),
  data: null, tab: null, pickId: null, pin: '', pin1: null, busy: 0
};
if (S.token) { const id = S.token.split('.')[0]; S.data = LS.get('cache_' + id, null); }

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => { n = Math.round((Number(n) || 0) * 100) / 100; return 'RM' + (Number.isInteger(n) ? n : n.toFixed(2)); };
const member = (id) => (S.data && S.data.members.find((m) => m.id === id)) || (S.data && S.data.parent && S.data.parent.allMembers.find((m) => m.id === id)) || { name: '?', avatar: '❔', color: '#999' };
const av = (m, cls = '') => `<div class="av ${cls}" style="--c:${esc(m.color)}">${esc(m.avatar)}</div>`;
const fmtDate = (ymd) => { if (!ymd) return ''; const d = new Date(ymd + 'T00:00:00'); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
const ago = (ms) => { const s = (Date.now() - ms) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; const d = Math.floor(s / 86400); return d === 1 ? 'yesterday' : d + ' days ago'; };
function rewardText(t) {
  if (t.type === 'simple') return money(t.reward);
  if (t.type === 'tiered') { const r = t.tiers.map((x) => Number(x.reward)); return money(Math.min(...r)) + '–' + money(Math.max(...r)); }
  if (t.type === 'multi') return 'up to ' + money(t.goals.reduce((a, g) => a + Number(g.reward), 0));
  return '';
}
const recText = (r) => r === 'daily' ? '🔁 Daily' : r === 'weekly' ? '📅 Weekly' : '1️⃣ One time';

function toast(msg, err) {
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), err ? 3500 : 2200);
}
function setBusy(d) {
  S.busy += d;
  let el = $('#busy');
  if (S.busy > 0 && !el) { el = document.createElement('div'); el.id = 'busy'; el.className = 'busy'; el.innerHTML = '<i></i>'; document.body.appendChild(el); }
  if (S.busy <= 0 && el) el.remove();
}

/* ---------- API ---------- */
async function api(action, payload = {}) {
  setBusy(1);
  try {
    const res = await fetch(S.api, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, token: S.token }, payload)) });
    const j = await res.json();
    if (!j.ok) {
      if (j.auth) { logout(true); throw new Error('Please log in again'); }
      throw new Error(j.error || 'Something went wrong');
    }
    if (j.state) { S.data = j.state; LS.set('cache_' + j.state.me.id, j.state); }
    return j;
  } catch (e) {
    if (e instanceof TypeError) throw new Error('No connection. Check your internet.');
    throw e;
  } finally { setBusy(-1); }
}
async function act(action, payload, okMsg) {
  try {
    await api(action, payload);
    closeSheet();
    if (okMsg) toast(okMsg);
    render();
    return true;
  } catch (e) { toast(e.message, true); return false; }
}
async function refresh(quiet) {
  if (!S.token) return;
  try { await api('state'); render(); } catch (e) { if (!quiet) toast(e.message, true); }
}
async function loadMembers() {
  try { const j = await api('members'); S.members = j.members; LS.set('members', j.members); render(); }
  catch (e) { toast(e.message, true); }
}
function logout(silent) {
  S.token = null; S.data = null; S.pickId = null; S.pin = ''; S.tab = null;
  LS.del('token');
  if (!silent) toast('Logged out');
  render();
  loadMembers();
}

/* ---------- sheets ---------- */
function openSheet(html) {
  $('#sheet').innerHTML = `<div class="sheet-bg" data-a="bg"><div class="sheet">${html}</div></div>`;
}
function closeSheet() { $('#sheet').innerHTML = ''; }

/* ---------- render root ---------- */
function render() {
  const app = $('#app');
  if (!S.api) { app.innerHTML = connectView(); return; }
  if (!S.token || !S.data) { app.innerHTML = S.pickId ? pinView() : pickView(); return; }
  document.documentElement.style.setProperty('--me', S.data.me.color || '#6d28d9');
  if (S.data.me.mustChangePin) { app.innerHTML = changePinView(); return; }
  app.innerHTML = S.data.me.role === 'kid' ? kidView() : parentView();
  if (S.data.me.role === 'kid') maybeCelebrate();
}

/* ---------- connect / login ---------- */
function connectView() {
  return `<div class="wrap"><div style="text-align:center;margin-top:40px"><div style="font-size:64px">🪙</div><h1>Coin Quest</h1>
  <p class="muted">One-time setup: paste the Web App link from your Google Sheet (Extensions → Apps Script → Deploy).</p></div>
  <div class="card"><label>Web App URL</label><input id="apiurl" placeholder="https://script.google.com/macros/s/.../exec">
  <div style="height:14px"></div><button class="btn block" data-a="connect">Connect</button></div></div>`;
}
function pickView() {
  const ms = S.members || [];
  return `<div class="wrap"><div style="text-align:center;margin-top:24px"><div style="font-size:56px">🪙</div><h1>Coin Quest</h1><p class="muted">Who's playing?</p></div>
  ${ms.length ? `<div class="who">${ms.map((m) => `<button data-a="pick" data-id="${m.id}">${av(m, 'lg')}${esc(m.name)}</button>`).join('')}</div>`
    : `<div class="empty"><div>⏳</div>Loading family…</div>`}
  </div>`;
}
function pinView(title) {
  const m = (S.members || []).find((x) => x.id === S.pickId) || { name: '', avatar: '', color: '#999' };
  return `<div class="wrap" style="text-align:center"><div class="row between"><button class="iconbtn" data-a="unpick">←</button><span></span></div>
  <div style="display:flex;justify-content:center;margin-top:6px">${av(m, 'lg')}</div>
  <h2 style="margin-top:10px">${title || 'Hi ' + esc(m.name) + '!'}</h2><p class="muted">${title ? '' : 'Enter your PIN'}</p>
  <div class="pin-dots" id="dots">${[0, 1, 2, 3].map((i) => `<i class="${S.pin.length > i ? 'f' : ''}"></i>`).join('')}</div>
  <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button data-a="key" data-k="${n}">${n}</button>`).join('')}<span></span><button data-a="key" data-k="0">0</button><button data-a="key" data-k="del">⌫</button></div></div>`;
}
function changePinView() {
  const m = S.data.me;
  const t = S.pin1 === null ? 'Choose your new secret PIN' : 'Type it again';
  return `<div class="wrap" style="text-align:center"><div style="display:flex;justify-content:center;margin-top:30px">${av(m, 'lg')}</div>
  <h2 style="margin-top:10px">${t}</h2><p class="muted">4 numbers. Don't tell anyone! 🤫</p>
  <div class="pin-dots" id="dots">${[0, 1, 2, 3].map((i) => `<i class="${S.pin.length > i ? 'f' : ''}"></i>`).join('')}</div>
  <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button data-a="key" data-k="${n}">${n}</button>`).join('')}<span></span><button data-a="key" data-k="0">0</button><button data-a="key" data-k="del">⌫</button></div></div>`;
}
async function onPinComplete() {
  const pin = S.pin;
  if (S.data && S.data.me.mustChangePin) {
    if (S.pin1 === null) { S.pin1 = pin; S.pin = ''; render(); return; }
    if (S.pin1 !== pin) { S.pin1 = null; S.pin = ''; render(); shakeDots(); toast("PINs didn't match. Try again.", true); return; }
    try {
      const j = await api('changePin', { newPin: pin });
      S.token = j.token; LS.set('token', j.token);
      S.pin1 = null; S.pin = '';
      toast('PIN saved 🔒'); render();
    } catch (e) { S.pin1 = null; S.pin = ''; render(); toast(e.message, true); }
    return;
  }
  try {
    const j = await api('login', { memberId: S.pickId, pin });
    S.token = j.token; LS.set('token', j.token);
    S.pin = ''; S.pickId = null; S.tab = null;
    if (j.mustChangePin) S.data.me.mustChangePin = true;
    render();
  } catch (e) { S.pin = ''; render(); shakeDots(); toast(e.message, true); }
}
function shakeDots() { const d = $('#dots'); if (d) { d.classList.add('shake'); setTimeout(() => d.classList.remove('shake'), 400); } }

/* ================= KID ================= */
function kidView() {
  const D = S.data, K = D.kid, st = K.stats, me = D.me;
  const tab = S.tab || 'quests';
  const lv = st.level;
  const pct = lv.next ? Math.min(100, Math.round((lv.xp - lv.floor) / (lv.next - lv.floor) * 100)) : 100;
  const head = `<div class="row between"><div class="row">${av(me)}<div><h2>Hi ${esc(me.name)}!</h2><div class="small muted">${lv.icon} ${esc(lv.name)} · <span class="flame">🔥 ${st.streak.current}</span> day streak</div></div></div>
    <div class="row"><button class="iconbtn" data-a="refresh" title="Refresh">↻</button><button class="iconbtn" data-a="menu" title="Menu">☰</button></div></div>`;
  const hero = `<div class="hero" style="margin-top:14px"><div class="small" style="opacity:.9;font-weight:800">MY COINS</div><div class="big">${money(st.wallet.total)}</div>

/* celebrations */
function maybeCelebrate() {
  const K = S.data.kid, key = 'seen_' + S.data.me.id;
  const seen = LS.get(key, null);
  if (seen === null) { LS.set(key, S.data.serverTime); return; }
  const fresh = K.ledger.filter((l) => l.ts > seen && l.amount > 0 && l.type !== 'transfer');
  const rejected = K.history.filter((s) => s.status === 'rejected' && s.reviewedAt > seen);
  LS.set(key, S.data.serverTime);
  if (!fresh.length) { if (rejected.length) toast('A parent sent back a quest. Check the note!'); return; }
  const sum = fresh.reduce((a, l) => a + l.amount, 0);
  const lines = {};
  fresh.forEach((l) => { const d = l.description.replace(/ \(saved \d+%\)$/, ''); lines[d] = (lines[d] || 0) + l.amount; });
  $('#overlay').innerHTML = `<div class="celebrate" data-a="closeCeleb"><div class="box"><div style="font-size:64px">🎉</div><h1>You earned ${money(sum)}!</h1>
    <div class="card" style="box-shadow:none;background:var(--bg);text-align:left">${Object.keys(lines).map((d) => `<div class="li"><div class="grow">${esc(d)}</div><span class="amt p">+${money(lines[d])}</span></div>`).join('')}</div>
    <button class="btn block gold" data-a="closeCeleb">Awesome! 🙌</button></div></div>`;
  confetti();
}
function confetti() {
  const em = ['🪙', '⭐', '🎉', '✨', '💰', '🌟'];
  for (let i = 0; i < 36; i++) {
    const s = document.createElement('span');
    s.className = 'conf';
    s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = 1.8 + Math.random() * 1.8 + 's';
    s.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 4500);
  }
}

/* ================= events ================= */
const H = {
  bg(d, el, e) { if (e.target === el) closeSheet(); },
  async connect() {

  pick(d) { S.pickId = d.id; S.pin = ''; render(); },
  unpick() { S.pickId = null; S.pin = ''; render(); },
  key(d) {
    if (d.k === 'del') S.pin = S.pin.slice(0, -1);
    else if (S.pin.length < 4) S.pin += d.k;
    $$('#dots i').forEach((el, i) => el.classList.toggle('f', S.pin.length > i));
    if (S.pin.length === 4) setTimeout(onPinComplete, 120);
  },
  tab(d) { S.tab = d.t; render(); window.scrollTo(0, 0); },
  refresh() { refresh(); },
  menu() {
    openSheet(`<h2>${esc(S.data.me.avatar)} ${esc(S.data.me.name)}</h2><div style="height:12px"></div>
      <button class="btn block ghost" data-a="changePin">🔑 Change my PIN</button><div style="height:10px"></div>
      <button class="btn block ghost" data-a="logout">🚪 Switch user</button>`);
  },
  changePin() { closeSheet(); S.data.me.mustChangePin = true; S.pin = ''; S.pin1 = null; render(); },
  logout() { closeSheet(); logout(); },
  closeCeleb(d, el, e) { if (e.target === el || el.tagName === 'BUTTON') $('#overlay').innerHTML = ''; },
  /* kid */
  submit(d) { submitSheet(d.id); },
  async doSubmit(d) {
    const t = S.data.kid.tasks.find((x) => x.id === d.id), p = { taskId: d.id, note: $('#note').value };
    if (t.type === 'tiered' && t.maxScore > 0) { p.score = $('#score').value; if (p.score === '') return toast('Type your score', true); }
    else if (t.type === 'tiered') { const c = $('input[name=tier]:checked'); if (!c) return toast('Choose how it went', true); p.tierIndex = Number(c.value); }
    else if (t.type === 'multi') { p.goalsDone = $$('input[name=goal]:checked').map((x) => Number(x.value)); if (!p.goalsDone.length) return toast('Tick at least one goal', true); }
    if (await act('submit', p)) { toast('Sent! 🚀 Waiting for a parent'); confetti(); }
  },
  propose() {
    openSheet(`<h2>💡 Suggest a quest</h2><p class="muted">Got an idea to earn coins? A parent will check it.</p>

      <div style="height:16px"></div><button class="btn block" data-a="doPropose">Send idea 💡</button>`);
  },
  doPropose() { act('proposeTask', { title: $('#pt').value, description: $('#pd').value, reward: $('#pr').value }, 'Idea sent! 💡'); },
  wishAdd() {
    openSheet(`<h2>🎁 Add a wish</h2><label>Pick an icon</label><div class="emojis" id="we">${WISH_EMOJI.map((e, i) => `<button class="${i ? '' : 'on'}" data-a="pickEmoji" data-v="${e}">${e}</button>`).join('')}</div>
      <label>What is it?</label><input id="wt" placeholder="e.g. Lego Ninjago set"><label>Price (RM)</label><input id="wp" type="number" inputmode="decimal" step="0.5">
      <div style="height:16px"></div><button class="btn block" data-a="doWish">Add to wishlist</button>`);
  },
  doWish() { act('wishAdd', { title: $('#wt').value, price: $('#wp').value, emoji: $('#we .on').dataset.v }, 'Added! ✨'); },
  wishDel(d) { if (confirm('Remove this wish?')) act('wishRemove', { id: d.id }); },
  buyWish(d) {
    const w = S.data.kid.wishlist.find((x) => x.id === d.id), wal = S.data.kid.stats.wallet;

  spendReq() { requestSheet('spend'); },
  unlockReq() { requestSheet('unlock'); },
  doRequest(d) { act('request', { type: d.type, amount: $('#ramt').value, description: $('#rdesc').value, wishId: d.wish }, 'Asked! 🙏'); },
  /* parent */
  approve(d) { act('review', { submissionId: d.id, decision: 'approve' }, 'Approved ✅'); },
  review(d) { reviewSheet(d.id); },
  sendBack(d) { reviewSheet(d.id, 'back'); },
  doReview(d) {

      if (d.type === 'tiered') { const c = $('input[name=rtier]:checked'); if (c) p.tierIndex = Number(c.value); }

    act('review', p, d.d === 'approve' ? 'Approved ✅' : 'Sent back ↩️');

  propOk(d) {
    const t = S.data.parent.proposals.find((x) => x.id === d.id);

  saveMember(d) {

  newTask() { taskSheet(null); },
  fromTemplate() { templateSheet(); },

  },
  toggleScored(d, el) {
    const on = el.checked;
    $('#tiers').classList.toggle('noscore', !on);
    $('#tierhint').textContent = on ? 'Kids type their score and the level is picked automatically.' : 'Kids choose the level they reached (e.g. Took part / Top 3 / Winner).';
  },
  addTier() { $('#tiers').insertAdjacentHTML('beforeend', tierRow({})); },
  addGoal() { $('#goals').insertAdjacentHTML('beforeend', goalRow({})); },
  delRow(d, el) { el.closest('.trow').remove(); },
  seg(d, el) { $$('button', el.parentNode).forEach((b) => b.classList.toggle('on', b === el)); },
  pickEmoji(d, el) { $$('button', el.parentNode).forEach((b) => b.classList.toggle('on', b === el)); },
  pickColor(d, el) { $$('button', el.parentNode).forEach((b) => b.classList.toggle('on', b === el)); },
  saveSettings() {
    act('settingsSave', { settings: { monthlyCap: $('#sCap').value, interestPct: $('#sInt').value, streakDays: $('#sDays').value, streakBonus: $('#sBonus').value, notifyMode: $('#sMode .on').dataset.v, notifyEmails: $('#sMail').value } }, 'Settings saved ✅');
  }
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;
  if (a === 'toggleScored') { H[a](el.dataset, el, e); return; }
  if (el.tagName === 'LABEL' || (el.tagName === 'INPUT')) return;
  if (!H[a]) return;
  if (a !== 'bg' && a !== 'closeCeleb') e.preventDefault();
  H[a](el.dataset, el, e);
});
// Live tier preview in the submit sheet
document.addEventListener('input', (e) => {
  if (e.target.id !== 'score') return;
  const box = $('#tierprev'); if (!box) return;
  const t = S.data.kid.tasks.find((x) => box.closest('.sheet').querySelector('[data-a=doSubmit]').dataset.id === x.id);
  const sc = Number(e.target.value);
  const hit = e.target.value === '' ? null : t.tiers.find((x) => sc >= x.min && sc <= x.max);
  box.innerHTML = hit ? `🎯 That's <b>${esc(hit.label)}</b>! You'll get <b>${money(hit.reward)}</b>` : t.tiers.map((x) => `${esc(x.label)}: ${x.min}–${x.max} → <b>${money(x.reward)}</b>`).join('<br>');
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.token) refresh(true); });

render();
if (S.api && !S.token) loadMembers();
if (S.api && S.token) refresh(true);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
